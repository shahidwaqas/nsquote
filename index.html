const fd=d=>{const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:d};
const row=()=>({c:'Inverter',b:'',m:'',s:SP.Inverter,wy:DW.Inverter,q:1,p:0,a:0,w:0,rw:0});
const un=x=>x.c=='Panel'&&n(x.w)&&n(x.rw)?n(x.w)*n(x.rw):(n(x.p)||n(x.a)/(n(x.q)||1));
const am=x=>(x.c=='Panel'&&n(x.w)&&n(x.rw))||n(x.p)?n(x.q)*un(x):n(x.a);
const pw=x=>x.c=='Panel'&&n(x.w)&&n(x.rw);
const fr=v=>Number.isInteger(+v)?f(v):(+v).toFixed(2);
const ia=x=>pw(x)?n(x.q)+' x '+n(x.w)+'W = '+f(n(x.q)*n(x.w))+'W &nbsp;x&nbsp; Rs '+fr(x.rw)+'/W &nbsp;|&nbsp; Amount: Rs '+f(am(x)):'Unit: Rs '+f(un(x))+' &nbsp;|&nbsp; Amount: Rs '+f(am(x));

const tot=()=>D.rows.reduce((s,x)=>s+am(x),0)+n(D.st.a)+n(D.ac.a)+n(D.inst)+n(D.misc.a)+n(D.frt)-n(D.disc);
function S2(p,v,num){const k=p.split('.');let o=D;while(k.length>1)o=o[k.shift()];o[k[0]]=num?n(v):v;T()}

function U(i,k,v,re){const x=D.rows[i],N=['q','p','w','rw','a'],ob=String(x.b||'').trim().toLowerCase();x[k]=N.includes(k)?n(v):v;
if(k=='c'){x.b=x.m='';x.s=SP[v];x.wy=DW[v];x.w=x.rw=x.p=x.a=0}
if(k=='b'){const m=Object.keys(P[x.c]||{}).find(z=>z.toLowerCase()==String(v).trim().toLowerCase());if(m)x.b=m;if(String(x.b).trim().toLowerCase()!==ob)x.m=''}
if(k=='m'&&x.c=='Panel'){const t=String(v).match(/(\d{3,4})(?:-\d{3,4})?\s*W/i);if(t){x.w=+t[1];re=1}}
if(['q','p','w','rw'].includes(k)&&!(k=='q'&&!n(x.p)&&!(x.c=='Panel'&&n(x.w)&&n(x.rw))))x.a=0;
T();const e=$('#ia'+i);if(e)e.innerHTML=ia(x);if(re)go('doc')}

/* ===== Auto lock after 10 min idle; after PIN, work resumes where it was ===== */
const IDLE_MS=10*60*1000;
let lastAct=Date.now(),_aw=0;
const isLocked=()=>!!document.getElementById('lgn');
function idleLock(){
 try{autosave()}catch(e){}
 try{if(D&&(tab=='doc'||tab=='pv'))localStorage.setItem('nsresume',JSON.stringify({t:tab,d:D,at:Date.now()}))}catch(e){}
 try{sessionStorage.removeItem('nsok');localStorage.removeItem('nsrem')}catch(e){}
 try{closeSb()}catch(e){}
 lgnShow('login','Session expired after 10 minutes of inactivity. Enter your password to continue where you left off.')}
function idleCheck(){if(isLocked())return false;if(Date.now()-lastAct>=IDLE_MS){idleLock();return true}return false}
function markAct(){if(isLocked())return;if(idleCheck())return;const n=Date.now();lastAct=n;if(n-_aw>5000){_aw=n;try{localStorage.setItem('nsact',String(n))}catch(e){}}}
function resumeWork(){try{const s=JSON.parse(localStorage.getItem('nsresume')||'null');localStorage.removeItem('nsresume');if(!s||!s.d||D||Date.now()-s.at>12*36e5)return;D=s.d;tab=s.t=='pv'?'doc':(s.t||'doc');go(tab)}catch(e){}}
['mousemove','mousedown','keydown','touchstart','scroll','click','input','wheel'].forEach(ev=>document.addEventListener(ev,markAct,true));
setInterval(idleCheck,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleCheck()});
/* lock buttons + keyboard block while locked + init */
(function(){const ic='<svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 11-12.8 0"/></svg>';
 const sf=document.getElementById('sbf'),kh=document.getElementById('khb');

 const cw=document.getElementById('clkw');if(cw){const b=document.createElement('button');b.id='lkb';b.type='button';b.title='Logout';b.setAttribute('aria-label','Logout');b.innerHTML=ic+'<span>Logout</span>';b.onclick=lockNow;cw.parentNode.insertBefore(b,cw)}
 window.addEventListener('keydown',e=>{const l=document.getElementById('lgn');if(l&&!l.contains(e.target)){e.stopImmediatePropagation();e.preventDefault()}},true);
 try{const a=aget();if(a&&a.r){delete a.r;aset(a)}let ok=false;try{ok=sessionStorage.getItem('nsok')=='1'||(+localStorage.getItem('nsrem')||0)>Date.now();const la=+localStorage.getItem('nsact')||0;if(ok&&la&&Date.now()-la>IDLE_MS){ok=false;sessionStorage.removeItem('nsok');localStorage.removeItem('nsrem')}}catch(e){}
  if(ok){const e=document.getElementById('lgn');if(e)e.remove()}else lgnShow('login')}
 catch(e){const l=document.getElementById('lgn');if(l)l.remove()}})();

<script>
/* ===== Daily Ledger (cash in / cash out + office expenses) ===== */
DB.inc=DB.inc||[];
const LDO=['Rent','Daily Expense','Tea / Refreshment','Electricity Bill','Gas Bill','Water Bill','Internet / Net Bill','Phone Bill','Salary','Fuel','Transport','Repair & Maintenance','Other'],
      LDI=['Cash Sale','Customer Payment','Advance Received','Opening Balance','Other Income'];
let LD=today(),LM='day',LT='out',LHO=0;
function lhd(t){DB.hd=DB.hd||{};if(!DB.hd[t])DB.hd[t]=(t=='out'?LDO:LDI).slice();return DB.hd[t]}
function ldShift(d,k){const x=new Date(d+'T00:00:00Z');if(LM=='month'){x.setUTCMonth(x.getUTCMonth()+k,1)}else x.setUTCDate(x.getUTCDate()+k);return x.toISOString().slice(0,10)}
function ldAll(){const A=[];DB.inc.forEach((e,i)=>A.push({k:'inc',i,e,d:e.date,in:n(e.amt),out:0}));DB.exp.forEach((e,i)=>A.push({k:'exp',i,e,d:e.date,in:0,out:n(e.amt)}));A.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:((a.e.t||0)-(b.e.t||0))||(a.k<b.k?1:-1));return A}
function ldData(){const A=ldAll(),st=LM=='day'?LD:LD.slice(0,7)+'-01',en=LM=='day'?LD:LD.slice(0,7)+'-31',ls=DB.ls||'';
 const op=A.filter(x=>x.d<st&&(!ls||x.d>=ls)).reduce((s,x)=>s+x.in-x.out,0),R=A.filter(x=>x.d>=st&&x.d<=en);let b=op;R.forEach(x=>{b+=x.in-x.out;x.bal=b});
 const ti=R.reduce((s,x)=>s+x.in,0),to=R.reduce((s,x)=>s+x.out,0);return{R,op,ti,to,cl:op+ti-to}}
function ldTitle(){return LM=='day'?fd(LD):new Date(LD.slice(0,7)+'-01T00:00:00').toLocaleString('en-GB',{month:'long',year:'numeric'})}
function ldSet(k,v){if(k=='d'){LD=v||LD}else if(k=='m'){LM=v}else if(k=='t'){LT=v}go('led')}
function ldAdd(){const a=n($('#lam').value);if(!a){toast('Enter amount');return}const d=$('#lad').value||today(),h=$('#lah').value||'Other',ds=$('#lads').value,t=Date.now();
 if(LT=='in')DB.inc.push({date:d,cat:h,d:ds,amt:a,t});else DB.exp.push({date:d,cat:h,d:ds,amt:a,pid:+(($('#lap')||{}).value)||0,t});save();LD=d;toast('Added');go('led')}
function ldDel(k,i){cf('Delete this entry? It will move to the Recycle Bin.',()=>{binAdd(k,DB[k][i]);DB[k].splice(i,1);save();go('led')})}
function ldHeadAdd(t){const el=$('#lhn'+t),v=(el.value||'').trim();if(!v)return;const L=lhd(t);if(L.some(x=>x.toLowerCase()==v.toLowerCase())){toast('Already in list');return}L.push(v);save();LHO=1;go('led')}

 (o.bin||[]).forEach(b=>{if(b&&b.it&&b.k!='doc'&&!b.it._id)b.it._id='L'+nsH(JSON.stringify(b.it))})}

 const bwm=mode=='bw',ss=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
 for(let y=0;y<H;y++){const fy=y/BK-.5;for(let x=0;x<W;x++){const fx=x/BK-.5,i=(y*W+x)*4,r=D[i]/Math.max(30,bil(fx,fy,0)),g=D[i+1]/Math.max(30,bil(fx,fy,1)),b=D[i+2]/Math.max(30,bil(fx,fy,2));

function nsRot(c){const o=document.createElement('canvas');o.width=c.height;o.height=c.width;const g=o.getContext('2d');g.translate(o.width,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return o}

 const crop=S.stage=='crop',chips=[['scan','Scan'],['bw','B&amp;W'],['color','Color'],['orig','Original']];
 o.innerHTML='<div class=sch><span>'+(crop?'Crop bill':'Refine')+'</span><button type=button onclick="nsScClose()" aria-label=Close>&times;</button></div><div class=sct>'+(crop?'Drag the 4 corners to fit the bill edges':'Choose the best look, then Save')+'</div><div class=scb id=scb><canvas id=sccv></canvas></div><div class=scf>'+

  chips.map(x=>'<button type=button class="'+(S.mode==x[0]?'on':'')+'" onclick="nsScMode(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<button type=button onclick="nsScBack()">Re-crop</button><button type=button onclick="nsScRotF()">Rotate</button><button type=button class=pri onclick="nsScSave()">Save</button>')+'</div>';
 const bx=document.getElementById('scb'),cv=document.getElementById('sccv'),srcW=crop?S.src.width:S.res.width,srcH=crop?S.src.height:S.res.height,aw=bx.clientWidth-20,ah=bx.clientHeight-4,k=Math.min(aw/srcW,ah/srcH,1.5);cv.width=Math.max(40,Math.round(srcW*k));cv.height=Math.max(40,Math.round(srcH*k));S.cv=cv;
 if(crop){nsScDraw();cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),sc=S.src.width/r.width,x=(e.clientX-r.left)*sc,y=(e.clientY-r.top)*sc;let bi=-1,bd=1e9;S.pts.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;bi=i}});if(bd<50*sc){S.drag=bi;try{cv.setPointerCapture(e.pointerId)}catch(_){}}};
  cv.onpointermove=e=>{if(S.drag==null||S.drag<0)return;const r=cv.getBoundingClientRect(),sc=S.src.width/r.width;S.pts[S.drag]={x:Math.max(0,Math.min(S.src.width,(e.clientX-r.left)*sc)),y:Math.max(0,Math.min(S.src.height,(e.clientY-r.top)*sc))};nsScDraw()};cv.onpointerup=cv.onpointercancel=()=>{S.drag=null}}
 else cv.getContext('2d').drawImage(S.res,0,0,cv.width,cv.height)}
function nsScDraw(){const S=NSS,cv=S.cv,g=cv.getContext('2d'),sc=cv.width/S.src.width;g.clearRect(0,0,cv.width,cv.height);g.drawImage(S.src,0,0,cv.width,cv.height);const P=S.pts.map(p=>({x:p.x*sc,y:p.y*sc}));
 g.save();g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.rect(0,0,cv.width,cv.height);g.moveTo(P[0].x,P[0].y);g.lineTo(P[1].x,P[1].y);g.lineTo(P[2].x,P[2].y);g.lineTo(P[3].x,P[3].y);g.closePath();g.fill('evenodd');g.restore();
 g.strokeStyle='#27d3a0';g.lineWidth=2.5;g.beginPath();P.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.stroke();P.forEach(p=>{g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,11,0,7);g.fill();g.strokeStyle='#18a37a';g.lineWidth=3;g.stroke()})}
function nsScAuto(){NSS.pts=nsDetect(NSS.src);nsScDraw()}
function nsScRotC(){const S=NSS,h=S.src.height;S.src=nsRot(S.src);S.pts=S.pts.map(p=>({x:h-p.y,y:p.x}));nsScUI()}
function nsScNext(){const S=NSS;S.warp=nsWarp(S.src,S.pts);S.cache={};S.res=S.cache[S.mode]=nsEnh(S.warp,S.mode);S.stage='filter';nsScUI()}
