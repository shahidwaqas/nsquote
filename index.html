function pinChk(v){const a=aget(),w=thr();if(w)return'Too many attempts. Try again in '+w+' sec';if(hs(a.s,v)!==a.p){badTry();return'Current PIN is wrong'}goodTry();return''}

function chQ(){dlg('Security Question',[{l:'Current PIN',t:'password'},{l:'Question',t:'select',o:QS},{l:'Answer'}],'Save',v=>{const m=pinChk(v[0]);if(m)return m;if(!v[2].trim())return'Enter an answer';const a=aget();a.q=QS[+v[1]];a.a=hs(a.s,normA(v[2]));aset(a);toast('Security question saved');return''})}

/* ===== Username + password login (cloud users; works offline for users who logged in before on this device) ===== */
const ADM='lovelyshahid.sw@gmail.com',DOM='@nssolar.app';
let NSU=null;try{NSU=JSON.parse(sessionStorage.getItem('nsuser')||'null')}catch(e){}
const uKey=u=>{let x=String(u||'');try{x=x.normalize('NFKC')}catch(_){}return x.replace(/[\u200b-\u200f\u2060\ufeff]/g,'').replace(/[\s\u00a0]+/g,' ').trim().toLowerCase()},uMail=u=>uMailV(u,verHint(u));
function ucGet(){try{return JSON.parse(localStorage.getItem('nsusers')||'{}')}catch(e){return{}}}

function updUserLbl(){const sf=document.getElementById('sbf');if(!sf)return;let d=document.getElementById('nsul');if(!d){d=document.createElement('div');d.id='nsul';d.style.cssText='font-size:11.5px;color:#cfe3f5;text-align:center;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';sf.insertBefore(d,sf.firstChild)}d.textContent=NSU?('User: '+NSU.name.split('@')[0]+(NSU.adm?' (Admin)':'')):''}
function setUser(n,adm){NSU={name:n,adm:adm?1:0};try{sessionStorage.setItem('nsuser',JSON.stringify(NSU))}catch(e){}updUserLbl()}
function lgnShow(mode,msg){if(mode=='login'||mode=='setup')newLogin(msg);else lgnShowOld(mode,msg)}
function newLogin(msg){const e=lgnEl();LA=doLogin2;let lu='';try{lu=localStorage.getItem('nslu')||''}catch(_){}
 const old=!!aget()&&!Object.keys(ucGet()).length;
 e.innerHTML=lgc('Secure Login',(msg?`<div class=lgok>${E(msg)}</div>`:'')+(lu?`<div id=lus style="margin:10px 0 2px;font-size:14px">Login as <b>${E(lu)}</b> <a href="#" onclick="uChg();return false" style="margin-left:8px;font-size:13px;color:var(--r);font-weight:600">Change user</a></div>`:'')+`<label id=lunw${lu?' style="display:none"':''}>Username<input id=lun autocomplete=username autocapitalize=none spellcheck=false placeholder="Username" value="${E(lu)}" onkeydown="if(event.key=='Enter'){event.preventDefault();document.getElementById('lpw').focus()}"></label>`+pwf('lpw','Password','Enter your password','current-password')+`<div class=lger id=lge></div><button class=mn id=lbtn type=button onclick="doLogin2()">Login</button><button class=lk type=button onclick="uForgot()">Forgot password?</button>`+(old?`<button class=lk type=button onclick="lgnShowOld('login')">Use old PIN</button>`:''));
 setTimeout(()=>{const i=document.getElementById(lu?'lpw':'lun');if(i)i.focus()},60)}
function uChg(){const w=document.getElementById('lunw'),l=document.getElementById('lus'),i=document.getElementById('lun');if(w)w.style.display='';if(l)l.style.display='none';var cb=document.getElementById('lchg');if(cb)cb.style.display='none';if(i){i.value='';i.focus()}}
async function uAllowed(em){const r=await fsReq('GET','ns_users/'+encodeURIComponent(em));return !!r}
function lgSpinGo(){let o=document.getElementById('lgspin');if(!o){o=document.createElement('div');o.id='lgspin';o.style.cssText='position:fixed;inset:0;z-index:99998;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 14px -apple-system,Arial,sans-serif;color:#b3261e';o.innerHTML='<style>@keyframes lgsp{to{transform:rotate(360deg)}}</style><div style="width:46px;height:46px;border:5px solid #f3c9c6;border-top-color:#b3261e;border-radius:50%;animation:lgsp .8s linear infinite"></div><div>Logging in...</div>';document.body.appendChild(o)}
 setTimeout(()=>{try{o.remove()}catch(_){}unlock(false)},2000)}
async function doLogin2(){const w=thr();if(w){lgErr('Too many attempts. Try again in '+w+' sec');return}
 const un=uKey(document.getElementById('lun').value),pw=document.getElementById('lpw').value;
 if(!un||!pw){lgErr('Enter username and password');return}
 const C=ucGet(),c=C[un];
 if(c&&hs(c.s,pw)===c.p){goodTry();try{localStorage.setItem('nslu',un)}catch(_){}setUser(un,c.adm);lgSpinGo();return}
 const b=document.getElementById('lbtn');if(b)b.disabled=true;lgErr('Checking...');
 try{await cldLoad();await firebase.auth().signInWithEmailAndPassword(uMail(un),pw);CL.user=firebase.auth().currentUser;
  const em=(CL.user.email||'').toLowerCase(),adm=em==ADM;
  if(!adm&&!(await uAllowed(em))){try{await firebase.auth().signOut()}catch(_){}CL.user=null;lgErr('This user is not allowed. Ask the admin.');if(b)b.disabled=false;return}
  const s=rnd(16,'0123456789abcdef');C[un]={s,p:hs(s,pw),adm:adm?1:0};ucSet(C);
  goodTry();try{localStorage.setItem('nslu',un)}catch(_){}setUser(un,adm);lgSpinGo();return
 }catch(e){const code=(e&&e.code)||'';if(/invalid|wrong-password|user-not-found/.test(code)){badTry();lgErr('Wrong username or password')}else lgErr(cldErr(e)+(c?'':' (first login on a device needs internet)'))}
 if(b)b.disabled=false}
async function uForgot(){const un=uKey(document.getElementById('lun').value);if(!un){lgErr('Enter your username first');return}
 if(!un.includes('@')){lgErr('Ask the admin - he will create a new user for you');return}
 try{await cldLoad();await firebase.auth().sendPasswordResetEmail(un);lgErr('Password reset link sent to your email')}catch(e){lgErr(cldErr(e))}}

/* ===== Recovery Code (PIN reset without SMS/OTP) ===== */
let RCP='',RCBK=false;
const normRC=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
function genRC(){const c=rnd(12,'ABCDEFGHJKMNPQRSTUVWXYZ23456789');return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8)}
function rcCopy(){try{navigator.clipboard.writeText(RCP).then(()=>lgErr('Code copied'),()=>lgErr('Could not copy - please write it down'))}catch(e){lgErr('Could not copy - please write it down')}}
function rcWa(){let n=String(document.getElementById('rwa').value||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='92'+n.slice(1);
 if(n.length<11||n.length>15){lgErr('Enter a valid WhatsApp number, e.g. 03001234567');return}
 const a=aget();if(a){a.wa=n;aset(a)}
 const t='NS Solar Energy - PIN Recovery Code: '+RCP+'\n(Keep this message safe. It is needed to reset your PIN.)';
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank')}
function rcDone(){RCP='';if(RCBK){RCBK=false;const e=document.getElementById('lgn');if(e)e.remove();try{toast('Recovery Code saved')}catch(_){}}else unlock(false)}
function newRC(){dlg('New Recovery Code',[{l:'Current PIN',t:'password'}],'Generate',v=>{const m=pinChk(v[0]);if(m)return m;const a=aget(),rc=genRC();a.rc=hs(a.s,'RC|'+normRC(rc));aset(a);RCP=rc;RCBK=true;setTimeout(()=>lgnShow('rcode'),0);return''})}
/* ===== Auto lock after 10 min idle; after PIN, work resumes where it was ===== */
const IDLE_MS=10*60*1000;
let lastAct=Date.now(),_aw=0;
const isLocked=()=>!!document.getElementById('lgn');
function idleLock(){
 try{autosave()}catch(e){}
 try{if(D&&(tab=='doc'||tab=='pv'))localStorage.setItem('nsresume',JSON.stringify({t:tab,d:D,at:Date.now()}))}catch(e){}
 try{sessionStorage.removeItem('nsok');localStorage.removeItem('nsrem')}catch(e){}
 try{closeSb()}catch(e){}
 lgnShow('login','Session expired after 10 minutes of inactivity. Enter your password to continue where you left off.')}
function idleCheck(){if(isLocked())return false;if(Date.now()-lastAct>=IDLE_MS){idleLock();return true}return false}
function markAct(){if(isLocked())return;if(idleCheck())return;const n=Date.now();lastAct=n;if(n-_aw>5000){_aw=n;try{localStorage.setItem('nsact',String(n))}catch(e){}}}
function resumeWork(){try{const s=JSON.parse(localStorage.getItem('nsresume')||'null');localStorage.removeItem('nsresume');if(!s||!s.d||D||Date.now()-s.at>12*36e5)return;D=s.d;tab=s.t=='pv'?'doc':(s.t||'doc');go(tab)}catch(e){}}
['mousemove','mousedown','keydown','touchstart','scroll','click','input','wheel'].forEach(ev=>document.addEventListener(ev,markAct,true));
setInterval(idleCheck,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleCheck()});
/* lock buttons + keyboard block while locked + init */
(function(){const ic='<svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 11-12.8 0"/></svg>';
 const sf=document.getElementById('sbf'),kh=document.getElementById('khb');
 if(sf){const b=document.createElement('button');b.id='lockb';b.type='button';b.innerHTML=ic+'Logout';b.onclick=lockNow;sf.insertBefore(b,sf.firstChild)}
 const cw=document.getElementById('clkw');if(cw){const b=document.createElement('button');b.id='lkb';b.type='button';b.title='Logout';b.setAttribute('aria-label','Logout');b.innerHTML=ic+'<span>Logout</span>';b.onclick=lockNow;cw.parentNode.insertBefore(b,cw)}
 window.addEventListener('keydown',e=>{const l=document.getElementById('lgn');if(l&&!l.contains(e.target)){e.stopImmediatePropagation();e.preventDefault()}},true);
 try{const a=aget();if(a&&a.r){delete a.r;aset(a)}let ok=false;try{ok=sessionStorage.getItem('nsok')=='1'||(+localStorage.getItem('nsrem')||0)>Date.now();const la=+localStorage.getItem('nsact')||0;if(ok&&la&&Date.now()-la>IDLE_MS){ok=false;sessionStorage.removeItem('nsok');localStorage.removeItem('nsrem')}}catch(e){}
  if(ok){const e=document.getElementById('lgn');if(e)e.remove()}else lgnShow('login')}
 catch(e){const l=document.getElementById('lgn');if(l)l.remove()}})();
</script>

 e.className='hero '+m;
 const sun=e.querySelector('#hsun'),moon=e.querySelector('#hmoon'),st=e.querySelector('#hstars');if(!sun)return;
 const pos=t=>{const x=24+372*t,y=205-165*Math.sin(Math.PI*t);return 'translate('+(x-346).toFixed(1)+' '+(y-50).toFixed(1)+')'};
 const up=h>=6&&h<18;sun.style.display=up?'':'none';
 if(up){const t=(h-6)/12;sun.setAttribute('transform',pos(t));const low=Math.sin(Math.PI*t)<.4;e.querySelectorAll('.hsb').forEach(c=>{c.style.fill=low?'#ff8a3d':'#ffc93c'})}
 const nt=m=='night';moon.style.display=nt?'':'none';st.style.display=nt?'':'none';

 var last=0;
 function bub(x,y,big){var d=document.createElement('i'),z=(big?10:6)+Math.random()*(big?16:12);d.className='nsb';

  document.body.appendChild(d);setTimeout(function(){d.remove()},1900)}
